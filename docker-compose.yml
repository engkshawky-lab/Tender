services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tender
      POSTGRES_USER: tender
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    depends_on: [db]
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://tender:${DB_PASSWORD:-change-me}@db:5432/tender
      TP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      TP_SECRET_KEY: ${SECRET_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: [files:/data]
volumes:
  pgdata:
  files:
